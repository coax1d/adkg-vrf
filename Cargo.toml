[package]
name = "adkg-vrf"
version = "0.1.0"
edition = "2021"
authors = ["Alistair Stewart", "Sergey Vasilyev <swasilyev@gmail.com>"]

[dependencies]
ark-std = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-ec = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false, features = ["derive"] }
# Pinned to the last arkworks-0.5-compatible commit; the default branch bumped
# to arkworks 0.6 (w3f/ark-transcript PR #3), which breaks this crate.
ark-transcript = { git = "https://github.com/w3f/ark-transcript", rev = "f7e27015" }
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"] }
hashbrown = "0.15"
sha2 = { version = "0.10.9", default-features = false }
derivative = { version = "2.2", features = ["use_core"] }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "straus"
harness = false

[features]
default = ["std"]
print-trace = ["ark-std/print-trace"]
std = [
    "ark-std/std",
    "ark-ff/std",
    "ark-ec/std",
    "ark-poly/std",
    "ark-serialize/std",
    "ark-transcript/std"
]